<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frontier Command｜前線指揮官</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#1b2833;--line:#344653;--gold:#e5b85c;--cyan:#65c7d8}
*{box-sizing:border-box}body{margin:0;background:#0d151c;color:#e8edf0;font:14px/1.4 system-ui,"Microsoft JhengHei",sans-serif;overflow:hidden}
#top{height:54px;background:#17232d;border-bottom:1px solid #344653;display:flex;align-items:center;gap:18px;padding:0 14px}
.brand{font-weight:900;letter-spacing:1px;color:#f2c66d;font-size:16px}.stat{color:#cbd6dc}.stat b{color:#fff;margin-left:4px;font-variant-numeric:tabular-nums}
#layout{height:calc(100vh - 54px);display:grid;grid-template-columns:minmax(0,1fr) 280px}
#stage{position:relative;min-width:0;min-height:0;background:#18251e}canvas{display:block;width:100%;height:100%;cursor:crosshair}
#side{background:#17232d;border-left:1px solid #344653;display:flex;flex-direction:column;min-height:0}
.panel{padding:12px;border-bottom:1px solid #344653}.panel h3{margin:0 0 9px;font-size:12px;letter-spacing:1px;color:#90a8b5;text-transform:uppercase}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
button{background:#263946;color:#eaf0f3;border:1px solid #425866;border-radius:6px;padding:9px 7px;font-weight:700;cursor:pointer;font-size:12px}
button:hover{background:#345064;border-color:#65c7d8}button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:#785a27;border-color:#c99b45;color:#fff}button.danger{background:#552f30;border-color:#87494b}
#selection{min-height:68px;color:#d9e2e7}.muted{color:#91a3ad;font-size:12px}
#log{overflow:auto;flex:1;padding:10px;font-size:12px;color:#aebdc5}.logline{padding:5px 0;border-bottom:1px solid #263640}
#hint{position:absolute;left:12px;bottom:12px;background:#101820d9;border:1px solid #536b71;border-radius:7px;padding:8px 11px;color:#c8d7dc;pointer-events:none;font-size:12px}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#081016d9;z-index:3}
.modal{width:min(480px,90%);background:#1b2a34;border:1px solid #536b71;border-radius:12px;padding:24px;box-shadow:0 20px 80px #000}
.modal h1{margin:0 0 8px;color:#f2c66d}.modal p{color:#b8c8d0;line-height:1.7}.modal button{width:100%;padding:13px;font-size:15px;margin-top:8px}
#pauseTag{position:absolute;top:12px;left:12px;color:#f2c66d;font-weight:900;display:none;text-shadow:0 2px 5px #000}
@media(max-width:760px){#layout{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 220px}#side{border-left:0;border-top:1px solid #344653;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr}#log{max-height:140px}.panel{padding:8px}.actions{grid-template-columns:repeat(3,1fr)}button{padding:7px 4px;font-size:11px}#top{gap:9px;font-size:11px}.brand{font-size:13px}}
</style>
</head>
<body>
<header id="top"><div class="brand">⚔ FRONTIER COMMAND</div><div class="stat">木材<b id="wood">300</b></div><div class="stat">礦石<b id="ore">220</b></div><div class="stat">石油<b id="oil">100</b></div><div class="stat">人口<b id="pop">5/30</b></div><div class="stat">文明<b id="era">石器時代</b></div><div style="margin-left:auto;display:flex;gap:6px"><button id="pause">Ⅱ 暫停</button><button id="speed">速度 ×1</button><button id="save">存檔</button><button id="reset" class="danger">重開</button></div></header>
<div id="layout"><main id="stage"><canvas id="game"></canvas><div id="pauseTag">PAUSED</div><div id="hint">左鍵選取單位／建築　右鍵移動、攻擊或採集　拖曳框選</div><div id="overlay"><div class="modal"><h1>前線指揮官</h1><p>建立你的基地，派遣平民採集木材與礦石，擴建兵營和戰車工廠，組成軍隊摧毀敵方堡壘。敵軍會持續發展並主動進攻。</p><p>勝利條件：摧毀敵方主堡與所有敵方堡壘。保護你的主堡，失去主堡將直接戰敗。</p><button id="start" class="primary">開始戰役</button></div></div></main>
<aside id="side"><section class="panel"><h3>指揮選單</h3><div id="selection">尚未選取單位。<div class="muted">選取平民後可建造設施；選取軍隊後可下達攻擊命令。</div></div></section><section class="panel"><h3>建造／生產</h3><div class="actions" id="actions"></div></section><section class="panel" style="grid-column:1/-1;min-height:0;display:flex;flex-direction:column"><h3>戰場情報</h3><div id="log"></div></section></aside></div>
<script>
(function(){
"use strict";
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
var W=1500,H=1000,scale=1,ox=0,oy=0,paused=true,speed=1,started=false,gameOver=false,last=0,acc=0,selected=[],placing=null,drag=null;
var resources={wood:600,ore:450,oil:250},enemyResources={wood:600,ore:450,oil:250},rallyPoints={p:null,e:null},techs={weapons:false,armor:false,engines:false},eras={p:0,e:0},eraNames=['石器時代','封建時代','帝國時代','科技時代'],popCap=30,units=[],buildings=[],nodes=[],bullets=[],effects=[],nextId=1,elapsed=0,aiTimer=0,spawnTimer=0;
var ui={wood:document.getElementById('wood'),ore:document.getElementById('ore'),oil:document.getElementById('oil'),pop:document.getElementById('pop'),era:document.getElementById('era'),selection:document.getElementById('selection'),actions:document.getElementById('actions'),log:document.getElementById('log')};
var defs={
worker:{name:'工程平民',cost:{wood:50},time:8,hp:55,range:18,damage:4,rate:1.1,speed:65,kind:'worker',pop:1},
rifle:{name:'步槍兵',cost:{wood:35,ore:15},time:6,hp:75,range:145,damage:10,rate:.8,speed:58,kind:'infantry',pop:1},
rocket:{name:'火箭兵',cost:{wood:25,ore:45},time:9,hp:62,range:190,damage:28,rate:1.8,speed:48,kind:'anti',pop:1},
tank:{name:'主力戰車',cost:{ore:100,oil:35},time:15,hp:260,range:175,damage:38,rate:1.5,speed:42,kind:'vehicle',pop:3},
artillery:{name:'自走火砲',cost:{ore:130,oil:55},time:19,hp:170,range:270,damage:65,rate:3.2,speed:28,kind:'artillery',pop:3},
scout:{name:'偵察車',cost:{ore:55,oil:20},time:10,hp:115,range:105,damage:8,rate:.65,speed:105,kind:'vehicle',pop:2},
medic:{name:'戰地醫護兵',cost:{wood:45,ore:35},time:11,hp:65,range:0,damage:0,rate:1,speed:54,kind:'support',pop:1},
heavy:{name:'重型戰車',cost:{ore:180,oil:90},time:24,hp:430,range:190,damage:58,rate:1.7,speed:31,kind:'vehicle',pop:4}
};
var buildingDefs={
hq:{name:'主堡',cost:{},hp:1300,w:90,h:78,kind:'hq'},
barracks:{name:'兵營',cost:{wood:130,ore:50},hp:550,w:72,h:62,kind:'barracks'},
factory:{name:'戰車工廠',cost:{wood:150,ore:180},hp:700,w:88,h:68,kind:'factory'},
lumber:{name:'伐木場',cost:{wood:90},hp:320,w:58,h:52,kind:'lumber'},
mine:{name:'採礦站',cost:{wood:100,ore:35},hp:360,w:58,h:52,kind:'mine'},
power:{name:'發電廠',cost:{wood:90,ore:35},hp:300,w:56,h:50,kind:'power'},
turret:{name:'機槍塔',cost:{wood:80,ore:100},hp:430,w:48,h:48,kind:'turret'},
fort:{name:'前線堡壘',cost:{wood:160,ore:180},hp:850,w:76,h:68,kind:'fort'},
lab:{name:'科技研究所',cost:{wood:180,ore:140},hp:520,w:70,h:60,kind:'lab'},
bunker:{name:'重型碉堡',cost:{wood:120,ore:140},hp:680,w:60,h:56,kind:'bunker'},
depot:{name:'補給中心',cost:{wood:150,ore:90},hp:480,w:64,h:56,kind:'depot'}
};
function log(s){var d=document.createElement('div');d.className='logline';d.textContent='['+fmt(elapsed)+'] '+s;ui.log.prepend(d);while(ui.log.children.length>30)ui.log.lastChild.remove()}
function fmt(t){return Math.floor(t/60)+':'+('0'+Math.floor(t%60)).slice(-2)}
function costText(c){return Object.keys(c).map(k=>({wood:'木',ore:'礦',oil:'油'}[k])+c[k]).join(' ')}
function eraName(team){return eraNames[eras[team]||0]}
function unitName(type,team){var names={worker:['石器採集者','封建工匠','帝國工程師','科技工程師'],rifle:['石矛戰士','長弓兵','火槍兵','電磁步兵'],rocket:['投石兵','弩砲手','火箭兵','等離子反裝甲兵'],scout:['馴狼斥候','輕騎斥候','裝甲偵察車','無人偵察機'],medic:['草藥療癒師','戰地醫護兵','野戰醫療官','醫療機器人'],tank:['攻城車','重型攻城車','主力戰車','懸浮重戰車'],artillery:['投石器','重型弩砲','自走火砲','軌道火砲'],heavy:['巨型攻城機','重裝戰車','超重型戰車','泰坦機甲']};return (names[type]||[])[eras[team]||0]||defs[type].name}
function canBuildAt(type,x,y){var d=buildingDefs[type];if(x-d.w/2<0||x+d.w/2>W||y-d.h/2<0||y+d.h/2>H)return false;return !buildings.some(b=>{var q=buildingDefs[b.type];return Math.abs(b.x-x)<(q.w+d.w)/2+8&&Math.abs(b.y-y)<(q.h+d.h)/2+8})}
function minEraForBuilding(type){return ({factory:2,lab:2,bunker:2,depot:1,fort:1,turret:1})[type]||0}
function minEraForUnit(type){return ({rocket:1,scout:1,medic:1,tank:2,artillery:2,heavy:3})[type]||0}
function eraCost(next){return [{wood:150,ore:100},{wood:300,ore:250,oil:100},{wood:450,ore:400,oil:250}][next-1]}
function canAdvance(team,next){var own=buildings.filter(b=>b.team===team);if(next===1)return own.some(b=>b.type==='barracks');if(next===2)return own.some(b=>b.type==='factory')&&own.some(b=>b.type==='lab');return own.some(b=>b.type==='lab')&&own.some(b=>b.type==='depot')}
function advanceEra(team){var next=eras[team]+1,c=eraCost(next),wallet=team==='p'?resources:enemyResources;if(next>3||!canAdvance(team,next)||!Object.keys(c).every(k=>(wallet[k]||0)>=c[k]))return false;Object.keys(c).forEach(k=>wallet[k]-=c[k]);eras[team]=next;if(team==='p')log('文明躍進！進入'+eraNames[next]+'，兵種名稱與可用科技已更新。');return true}
function canPay(c){return Object.keys(c).every(k=>resources[k]>=c[k])}
function pay(c){if(!canPay(c))return false;Object.keys(c).forEach(k=>resources[k]-=c[k]);return true}
function makeUnit(team,type,x,y){var d=defs[type],u={id:nextId++,team:team,kind:'unit',type:type,x:x,y:y,hp:d.hp,max:d.hp,order:null,target:null,carry:0,resource:null,cool:Math.random(),buildQueue:[],moving:false};units.push(u);return u}
function makeBuilding(team,type,x,y){var d=buildingDefs[type],b={id:nextId++,team:team,kind:'building',type:type,x:x,y:y,hp:d.hp,max:d.hp,queue:[],progress:0,active:true};buildings.push(b);return b}
function node(type,x,y,amount){nodes.push({type:type,x:x,y:y,amount:amount,max:amount})}
function init(){
resources={wood:600,ore:450,oil:250};enemyResources={wood:600,ore:450,oil:250};rallyPoints={p:null,e:null};techs={weapons:false,armor:false,engines:false};eras={p:0,e:0};units=[];buildings=[];nodes=[];bullets=[];effects=[];nextId=1;elapsed=0;aiTimer=0;spawnTimer=0;gameOver=false;selected=[];placing=null;popCap=30;
makeBuilding('p','hq',245,500);makeBuilding('p','barracks',365,425);
for(var i=0;i<4;i++)makeUnit('p','worker',320+i*22,565+(i%2)*20);
makeUnit('p','rifle',420,510);
makeBuilding('e','hq',1250,500);makeBuilding('e','barracks',1135,420);makeBuilding('e','fort',1030,500);
for(var i=0;i<4;i++)makeUnit('e','worker',1160+i*18,650+(i%2)*20);
for(var i=0;i<5;i++)makeUnit('e','rifle',1050+i*20,470+(i%2)*20);
for(var i=0;i<4;i++){node('wood',450+i*55,180+(i%2)*60,1800);node('wood',580+i*45,800+(i%2)*35,1800)}
for(var i=0;i<5;i++)node('ore',700+(i%3)*55,260+Math.floor(i/3)*65,2200);
node('oil',850,760,1800);node('oil',930,220,1800);
updateUI();log('戰役開始。敵軍基地位於東側，準備擴張。');
}
function countPop(team){return units.filter(u=>u.team===team).reduce((a,u)=>a+defs[u.type].pop,0)}
function myCap(){return 30+buildings.filter(b=>b.team==='p'&&b.type==='hq').length*10+buildings.filter(b=>b.team==='p'&&b.type==='fort').length*5}
function updateUI(){
selected=selected.filter(o=>o&&Number(o.hp)>0);ui.wood.textContent=Math.floor(resources.wood);ui.ore.textContent=Math.floor(resources.ore);ui.oil.textContent=Math.floor(resources.oil);ui.pop.textContent=countPop('p')+'/'+myCap();ui.era.textContent=eraName('p');
try{renderActions();renderSelection()}catch(err){console.error('UI render error',err);ui.selection.textContent='介面更新錯誤：'+(err&&err.message?err.message:'未知錯誤');ui.actions.replaceChildren()}
}
function renderActions(){
var b=selected.length===1?selected[0]:null,html='';
function btn(label,fn,disabled){var el=document.createElement('button');el.textContent=label;el.disabled=!!disabled;el.onclick=fn;ui.actions.appendChild(el)}
ui.actions.innerHTML='';
if(placing){btn('取消建造',function(){placing=null;renderActions()});return}
if(b&&b.team==='p'&&b.kind==='unit'&&b.type==='worker'){
Object.keys(buildingDefs).filter(k=>k!=='hq'&&eras.p>=minEraForBuilding(k)).forEach(k=>{var d=buildingDefs[k];btn(d.name+'\n'+costText(d.cost),function(){placing=k;log('選擇建造'+d.name+'：只能放在沒有任何建築的空地。');renderActions()},!canPay(d.cost))});
}else if(b&&b.team==='p'&&b.kind==='building'){
if(b.type==='hq'){var next=eras.p+1;if(next<=3){var ec=eraCost(next),req=next===1?'需要兵營':next===2?'需要戰車工廠＋研究所':'需要研究所＋補給中心';btn('文明躍進：'+eraNames[next]+'（'+costText(ec)+'）',function(){if(advanceEra('p'))updateUI();else log('升級條件不足：'+req+'，或資源不足。')},!canAdvance('p',next)||!canPay(ec))}}
if(b.type==='hq'||b.type==='barracks'){btn(unitName('worker','p')+' '+costText(defs.worker.cost),function(){train(b,'worker')},!canPay(defs.worker.cost)||countPop('p')>=myCap());}
if(b.type==='barracks'){['rifle','rocket','medic'].filter(k=>eras.p>=minEraForUnit(k)).forEach(k=>btn(unitName(k,'p')+' '+costText(defs[k].cost),function(){train(b,k)},!canPay(defs[k].cost)||countPop('p')+defs[k].pop>myCap()))}if(b.type==='fort'){btn('設為部隊集結點',function(){rallyPoints.p={x:b.x,y:b.y};log('部隊集結點已設為此堡壘');updateUI()});btn('清除集結點',function(){rallyPoints.p=null;log('已清除前線集結點');updateUI()},!rallyPoints.p)}
if(b.type==='factory'){['tank','artillery','scout','heavy'].filter(k=>eras.p>=minEraForUnit(k)).forEach(k=>btn(unitName(k,'p')+' '+costText(defs[k].cost),function(){train(b,k)},!canPay(defs[k].cost)||countPop('p')+defs[k].pop>myCap()))}
if(b.type==='lab'){[['weapons','武器改良','ore',120],['armor','裝甲強化','ore',100],['engines','引擎升級','oil',100]].forEach(t=>btn(t[1]+' '+t[2]+t[3],function(){if(techs[t[0]])return;var c={};c[t[2]]=t[3];if(pay(c)){techs[t[0]]=true;log('科技完成：'+t[1]);updateUI()}},techs[t[0]]||!canPay((()=>{var c={};c[t[2]]=t[3];return c})())))}
btn('修復建築 50木',function(){if(pay({wood:50})){b.hp=Math.min(b.max,b.hp+180);log('建築已修復')}updateUI()},resources.wood<50||b.hp>=b.max);
}
if(!ui.actions.children.length){btn('選取平民以建造',function(){},true);btn('選取兵營／工廠以生產',function(){},true)}
}
function renderSelection(){
if(!selected.length){ui.selection.textContent='尚未選取單位。';var tip=document.createElement('div');tip.className='muted';tip.textContent='選取平民後可建造設施；選取軍隊後可下達攻擊命令。';ui.selection.appendChild(tip);return}
if(selected.length>1){ui.selection.textContent='已選取 '+selected.length+' 個單位';var tip=document.createElement('div');tip.className='muted';tip.textContent='右鍵移動或攻擊。選取平民可下達採集命令。';ui.selection.appendChild(tip);return}
var o=selected[0];if(!o||typeof o!=='object'){selected=[];ui.selection.textContent='尚未選取單位。';return}
var isUnit=o.kind==='unit'||!!defs[o.type],def=isUnit?defs[o.type]:buildingDefs[o.type];
if(!def){ui.selection.textContent='選取目標資料異常，請重新選取。';return}
var hp=Math.max(0,Math.ceil(Number(o.hp)||0))+'/'+(Number(o.max)||def.hp);
var title=document.createElement('b');title.textContent=isUnit?unitName(o.type,o.team):def.name;var detail=document.createElement('div');detail.className='muted';var info='耐久 '+hp;if(!isUnit){var notes={lab:'可研究武器、裝甲與引擎科技',bunker:'自動攻擊 175 範圍內敵軍',depot:'附近友軍緩慢恢復生命',lumber:'附近木材採集效率 +50%，可交付木材',mine:'附近礦石採集效率 +50%，可交付礦石',power:'附近油田採集效率 +50%，可交付石油',fort:'周圍友軍每秒恢復 7 HP；可設為部隊集結點',turret:'自動攻擊 210 範圍內的敵軍'};info+='　'+(notes[o.type]||'基地設施');if(Array.isArray(o.queue)&&o.queue.length)info+='　生產中 '+o.queue.length;}detail.textContent=info;ui.selection.replaceChildren(title,detail);
}
function train(b,type){var d=defs[type];if(eras.p<minEraForUnit(type)){log('尚未進入可訓練此兵種的時代');return}if(!pay(d.cost)||countPop('p')+d.pop>myCap()){log('資源或人口不足');updateUI();return}b.queue.push({type:type,remain:d.time});log(b.type==='factory'?'戰車生產排程':'部隊生產排程：'+d.name);updateUI()}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearestNode(u,type){var best=null,bd=1e9;nodes.forEach(n=>{if(n.type===type&&n.amount>0){var d=dist(u,n);if(d<bd){best=n;bd=d}}});return best}
function nearestEnemy(u,range){var best=null,bd=range||1e9;units.concat(buildings).forEach(o=>{if(o.team!==u.team&&o.hp>0){var d=dist(u,o);if(d<bd){bd=d;best=o}}});return best}
function rightClick(x,y){
if(placing){var d=buildingDefs[placing];if(!canBuildAt(placing,x,y)){log('建造失敗：此處與己方／敵方建築重疊，或超出地圖範圍。');return}if(eras.p<minEraForBuilding(placing)){log('尚未進入可建造此設施的時代');return}if(!pay(d.cost)){log('資源不足');return}makeBuilding('p',placing,x,y);log('完成建造：'+d.name);placing=null;updateUI();return}
if(!selected.length)return;
var target=units.concat(buildings).find(o=>o.team==='e'&&Math.hypot(o.x-x,o.y-y)<Math.max(22,o.kind==='building'?40:20));
selected.forEach(u=>{if(u.kind!=='unit'||u.team!=='p')return;if(target){u.order={type:'attack',target:target.id};u.target=target.id}else if(u.type==='worker'){var n=nodes.find(n=>dist(n,{x:x,y:y})<35&&n.amount>0);if(n)u.order={type:'gather',node:n};else u.order={type:'move',x:x,y:y}}else u.order={type:'move',x:x,y:y}});
}
function screenToWorld(cx,cy){var r=canvas.getBoundingClientRect();return{x:(cx-r.left-ox)/scale,y:(cy-r.top-oy)/scale}}
function resize(){var r=stage.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.floor(r.width*dpr);canvas.height=Math.floor(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(r.width/W,r.height/H);ox=(r.width-W*scale)/2;oy=(r.height-H*scale)/2}
window.addEventListener('resize',resize);resize();
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('mousedown',e=>{var p=screenToWorld(e.clientX,e.clientY);if(e.button===2){rightClick(p.x,p.y);return}drag={x:p.x,y:p.y,cx:e.clientX,cy:e.clientY}});
canvas.addEventListener('mouseup',e=>{if(!drag)return;var p=screenToWorld(e.clientX,e.clientY);if(Math.hypot(e.clientX-drag.cx,e.clientY-drag.cy)>8){var x1=Math.min(drag.x,p.x),x2=Math.max(drag.x,p.x),y1=Math.min(drag.y,p.y),y2=Math.max(drag.y,p.y);selected=units.filter(u=>u.team==='p'&&u.x>=x1&&u.x<=x2&&u.y>=y1&&u.y<=y2)}else{var hit=units.concat(buildings).filter(o=>o.team==='p'&&Math.hypot(o.x-p.x,o.y-p.y)<(o.kind==='building'?48:18)).sort((a,b)=>dist(a,p)-dist(b,p))[0];selected=hit?[hit]:[]}drag=null;updateUI()});
function moveTo(o,x,y,dt){var dx=x-o.x,dy=y-o.y,d=Math.hypot(dx,dy);if(d>5){var sp=defs[o.type].speed;if(o.team==='p'&&techs.engines)sp*=1.25;var step=Math.min(d,sp*dt);o.x+=dx/d*step;o.y+=dy/d*step}}
function findById(id){return units.concat(buildings).find(o=>o.id===id)}
function shoot(a,t,d,dt){if(!t||t.hp<=0)return;var dd=dist(a,t);if(dd>d.range){moveTo(a,t.x,t.y,dt);return}a.cool-=dt;if(a.cool<=0){a.cool=d.rate;bullets.push({x:a.x,y:a.y,tx:t.x,ty:t.y,team:a.team,damage:d.damage,speed:340,type:a.type})}}
function updateUnit(u,dt){
var d=defs[u.type];if(u.type==='medic'){var patient=units.filter(v=>v.team===u.team&&v!==u&&v.hp>0&&v.hp<v.max&&dist(u,v)<160).sort((a,b)=>(a.hp/a.max)-(b.hp/b.max))[0];if(patient){if(dist(u,patient)>28)moveTo(u,patient.x,patient.y,dt);else patient.hp=Math.min(patient.max,patient.hp+13*dt)}return}if(u.order&&u.order.type==='move'){moveTo(u,u.order.x,u.order.y,dt);if(Math.hypot(u.x-u.order.x,u.y-u.order.y)<7)u.order=null;return}
if(u.type==='worker'){
if(u.order&&u.order.type==='gather'){var n=u.order.node;if(!n||n.amount<=0){n=nearestNode(u,u.resource||'wood');u.order.node=n;if(!n)return}if(dist(u,n)>22){moveTo(u,n.x,n.y,dt)}else{u.gatherTime=(u.gatherTime||0)+dt;if(u.gatherTime>=1){u.gatherTime=0;var nearby=buildings.find(b=>b.team===u.team&&b.type===(n.type==='wood'?'lumber':n.type==='ore'?'mine':'power')&&dist(b,n)<260);var amount=Math.min(nearby?12:8,n.amount);n.amount-=amount;u.carry+=amount;u.resource=n.type;if(u.carry>=40||n.amount<=0){var depot=buildings.filter(b=>b.team===u.team&&b.type===(u.resource==='wood'?'lumber':u.resource==='ore'?'mine':'power')).sort((a,b)=>dist(u,a)-dist(u,b))[0]||buildings.find(b=>b.team===u.team&&b.type==='hq');if(depot){u.order={type:'return',home:depot.id};}}}}}
else if(u.order&&u.order.type==='return'){var h=findById(u.order.home);if(h&&dist(u,h)>28)moveTo(u,h.x,h.y,dt);else if(h){var wallet=u.team==='p'?resources:enemyResources;wallet[u.resource]=(wallet[u.resource]||0)+u.carry;u.carry=0;u.order={type:'gather',node:nearestNode(u,u.resource)||nearestNode(u,'wood')};}}
else{var threat=nearestEnemy(u,110);if(threat&&threat.kind==='unit'&&threat.type!=='worker')shoot(u,threat,d,dt)}
return}
var t=u.order&&u.order.type==='attack'?findById(u.order.target):nearestEnemy(u,d.range+80);
if(t&&t.hp>0)shoot(u,t,d,dt);else if(u.order&&u.order.type==='attack')u.order=null;
}
function updateBuilding(b,dt){
if(b.queue&&b.queue.length){var q=b.queue[0];q.remain-=dt;if(q.remain<=0){var d=buildingDefs[b.type];var rally=rallyPoints[b.team]||{x:b.x,y:b.y};makeUnit(b.team,q.type,rally.x+(Math.random()-.5)*35,rally.y+35+(Math.random()-.5)*25);b.queue.shift();if(b.team==='p')log('部隊完成：'+unitName(q.type,b.team))}}
if(b.type==='turret'){var target=nearestEnemy(b,210);if(target){b.cool=(b.cool||0)-dt;if(b.cool<=0){b.cool=1.0;bullets.push({x:b.x,y:b.y,tx:target.x,ty:target.y,team:b.team,damage:18,speed:400,type:'turret'})}}}if(b.type==='fort'){units.forEach(u=>{if(u.team===b.team&&u.hp>0&&dist(u,b)<115)u.hp=Math.min(u.max,u.hp+7*dt)});}
if(b.type==='bunker'){var bt=nearestEnemy(b,175);if(bt){b.cool=(b.cool||0)-dt;if(b.cool<=0){b.cool=1.25;bullets.push({x:b.x,y:b.y,tx:bt.x,ty:bt.y,team:b.team,damage:13,speed:380,type:'bunker'})}}}
if(b.type==='depot'&&b.team==='p'){units.forEach(u=>{if(u.team==='p'&&u.type!=='worker'&&dist(u,b)<100)u.hp=Math.min(u.max,u.hp+2*dt)});}
}
function findOpenBuildingSpot(type,x,y){for(var r=0;r<=260;r+=35){for(var a=0;a<8;a++){var ang=a*Math.PI/4,px=Math.max(45,Math.min(W-45,x+Math.cos(ang)*r)),py=Math.max(45,Math.min(H-45,y+Math.sin(ang)*r));if(canBuildAt(type,px,py))return{x:px,y:py}}}return null}
function enemyAI(dt){
aiTimer+=dt;if(aiTimer>12){aiTimer=0;var ehq=buildings.find(b=>b.team==='e'&&b.type==='hq');if(!ehq)return;
var workers=units.filter(u=>u.team==='e'&&u.type==='worker');
if(workers.length<5&&countPop('e')<28)makeUnit('e','worker',ehq.x-75,ehq.y+75);
var eb=buildings.filter(b=>b.team==='e');
var ecoTypes=[['lumber','wood'],['mine','ore'],['power','oil']];ecoTypes.forEach(pair=>{if(!eb.some(b=>b.type===pair[0])){var n=nodes.filter(n=>n.type===pair[1]&&n.amount>0).sort((a,b)=>Math.hypot(a.x-ehq.x,a.y-ehq.y)-Math.hypot(b.x-ehq.x,b.y-ehq.y))[0];if(n&&enemyResources.wood>=buildingDefs[pair[0]].cost.wood&&(enemyResources.ore||0)>=(buildingDefs[pair[0]].cost.ore||0)){enemyResources.wood-=buildingDefs[pair[0]].cost.wood;enemyResources.ore-=buildingDefs[pair[0]].cost.ore||0;makeBuilding('e',pair[0],n.x-55,n.y+48);eb.push(buildings[buildings.length-1]);}}});
if(!eb.some(b=>b.type==='turret')&&eras.e>=1){var ep=findOpenBuildingSpot('turret',ehq.x-140,ehq.y+110);if(ep)makeBuilding('e','turret',ep.x,ep.y)}
var barr=eb.find(b=>b.type==='barracks');if(barr&&countPop('e')<28){var type=Math.random()<.68?'rifle':'rocket';if(Object.keys(defs[type].cost).every(k=>(enemyResources[k]||0)>=defs[type].cost[k])){Object.keys(defs[type].cost).forEach(k=>enemyResources[k]-=defs[type].cost[k]);barr.queue.push({type:type,remain:defs[type].time});}}
if(eras.e===0&&enemyResources.wood>=150&&enemyResources.ore>=100&&canAdvance('e',1))advanceEra('e');if(eras.e===1&&enemyResources.wood>=300&&enemyResources.ore>=250&&enemyResources.oil>=100&&canAdvance('e',2))advanceEra('e');if(eras.e===2&&enemyResources.wood>=450&&enemyResources.ore>=400&&enemyResources.oil>=250&&canAdvance('e',3))advanceEra('e');
var fac=eb.find(b=>b.type==='factory');if(fac&&Math.random()<.8&&countPop('e')<28&&Object.keys(defs.tank.cost).every(k=>(enemyResources[k]||0)>=defs.tank.cost[k])){Object.keys(defs.tank.cost).forEach(k=>enemyResources[k]-=defs.tank.cost[k]);fac.queue.push({type:'tank',remain:defs.tank.time});}
[['lab', 'wood',180,'ore',140],['bunker','wood',120,'ore',140],['depot','wood',150,'ore',90],['factory','wood',150,'ore',180]].forEach(v=>{if(!eb.some(b=>b.type===v[0])&&eras.e>=minEraForBuilding(v[0])&&enemyResources[v[1]]>=v[2]&&enemyResources[v[3]]>=v[4]){var ep=findOpenBuildingSpot(v[0],ehq.x-170+(Math.random()-.5)*100,ehq.y+(Math.random()-.5)*240);if(ep){enemyResources[v[1]]-=v[2];enemyResources[v[3]]-=v[4];makeBuilding('e',v[0],ep.x,ep.y);eb.push(buildings[buildings.length-1]);}}});
if(elapsed>90&&!eb.some(b=>b.type==='fort')&&eras.e>=1){var fp=findOpenBuildingSpot('fort',ehq.x-210,ehq.y-120);if(fp)makeBuilding('e','fort',fp.x,fp.y)}
}
units.filter(u=>u.team==='e'&&u.type==='worker'&&(!u.order||u.order.type==='gather')).forEach(u=>{if(!u.order){var choices=['wood','ore','oil'].map(t=>nearestNode(u,t)).filter(Boolean).sort((a,b)=>a.amount-b.amount);var n=choices[0]||nearestNode(u,'wood');if(n){u.resource=n.type;u.order={type:'gather',node:n};}}});
var enemyArmy=units.filter(u=>u.team==='e'&&u.type!=='worker'),myArmy=units.filter(u=>u.team==='p'&&u.type!=='worker');
if(enemyArmy.length>6&&myArmy.length>0){enemyArmy.forEach(u=>{if(!u.order||u.order.type!=='attack'){var h=buildings.find(b=>b.team==='p'&&b.type==='hq');if(h)u.order={type:'attack',target:h.id}}})}
}
function tick(dt){
elapsed+=dt;enemyAI(dt);
units.slice().forEach(u=>{if(u.hp>0)updateUnit(u,dt)});
buildings.slice().forEach(b=>{if(b.hp>0)updateBuilding(b,dt)});
bullets.forEach(b=>{var dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy),step=b.speed*dt;if(d<=step+5){var target=units.concat(buildings).filter(o=>o.team!==b.team&&o.hp>0).sort((a,c)=>Math.hypot(a.x-b.tx,a.y-b.ty)-Math.hypot(c.x-b.tx,c.y-b.ty))[0];if(target&&Math.hypot(target.x-b.tx,target.y-b.ty)<55){var damage=b.damage;if(target.team==='p'&&techs.armor&&target.kind==='unit')damage*=.8;if(b.team==='p'&&techs.weapons)damage*=1.25;target.hp-=damage;effects.push({x:b.tx,y:b.ty,t:.2});}b.dead=true}else{b.x+=dx/d*step;b.y+=dy/d*step}});bullets=bullets.filter(b=>!b.dead);
units=units.filter(u=>u.hp>0);buildings=buildings.filter(b=>b.hp>0);
nodes.forEach(n=>{if(n.amount<=0)n.depleted=true});nodes=nodes.filter(n=>!n.depleted);
effects.forEach(e=>e.t-=dt);effects=effects.filter(e=>e.t>0);
var phq=buildings.some(b=>b.team==='p'&&b.type==='hq'),ehq=buildings.some(b=>b.team==='e'&&b.type==='hq'),forts=buildings.some(b=>b.team==='e'&&b.type==='fort');
if(!phq||(!ehq&&!forts)){gameOver=true;paused=true;document.getElementById('overlay').style.display='flex';document.querySelector('.modal').innerHTML=phq?'<h1>戰役勝利！</h1><p>敵方主堡與所有前線堡壘均已摧毀。你成功掌握戰場。</p><button id="again" class="primary">重新開始</button>':'<h1>基地失守</h1><p>你的主堡已被摧毀。重新整頓經濟與防線，再次出擊吧。</p><button id="again" class="primary">重新開始</button>';document.getElementById('again').onclick=()=>{init();document.getElementById('overlay').style.display='none';paused=false};}
if(!tick.uiTimer)tick.uiTimer=0;tick.uiTimer+=dt;if(tick.uiTimer>=0.5){tick.uiTimer=0;updateUI();}
}
function draw(){
var r=stage.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);
ctx.fillStyle='#263c2e';ctx.fillRect(0,0,W,H);
for(var x=0;x<W;x+=50)for(var y=0;y<H;y+=50){ctx.strokeStyle='rgba(180,210,160,.055)';ctx.strokeRect(x,y,50,50);if(((x/50+y/50)%7)===0){ctx.fillStyle='rgba(120,150,100,.08)';ctx.fillRect(x+8,y+9,3,3)}}
ctx.fillStyle='#354638';ctx.fillRect(730,0,35,H);ctx.fillStyle='#526047';ctx.fillRect(738,0,5,H);
nodes.forEach(n=>{ctx.save();ctx.translate(n.x,n.y);if(n.type==='wood'){ctx.fillStyle='#244e35';ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#39734a';ctx.beginPath();ctx.arc(-7,-8,12,0,7);ctx.fill();ctx.fillStyle='#755a3d';ctx.fillRect(-3,4,6,17)}else if(n.type==='ore'){ctx.fillStyle='#73838b';ctx.beginPath();ctx.moveTo(-19,10);ctx.lineTo(-9,-16);ctx.lineTo(10,-20);ctx.lineTo(21,8);ctx.lineTo(3,18);ctx.closePath();ctx.fill();ctx.fillStyle='#b6c4c7';ctx.fillRect(-5,-9,8,4)}else{ctx.fillStyle='#171f28';ctx.beginPath();ctx.ellipse(0,0,24,14,0,0,7);ctx.fill();ctx.fillStyle='#9a7842';ctx.fillRect(-13,-2,26,4)}ctx.restore()});
buildings.forEach(b=>{var d=buildingDefs[b.type],friendly=b.team==='p';ctx.save();ctx.translate(b.x,b.y);ctx.fillStyle=friendly?'#315c7a':'#783c39';ctx.strokeStyle=friendly?'#8cc7dc':'#e58b78';ctx.lineWidth=2;ctx.fillRect(-d.w/2,-d.h/2,d.w,d.h);ctx.strokeRect(-d.w/2,-d.h/2,d.w,d.h);ctx.fillStyle=friendly?'#79b8d0':'#d77866';if(b.type==='hq'){ctx.fillRect(-d.w*.25,-d.h*.28,d.w*.5,d.h*.56);ctx.fillStyle='#d8d6b1';ctx.fillRect(-8,-d.h/2-9,16,13)}else if(b.type==='turret'){ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.fill();ctx.fillStyle='#1a252b';ctx.fillRect(-4,-25,8,27)}else{ctx.fillRect(-d.w*.25,-d.h*.25,d.w*.5,d.h*.5)}ctx.fillStyle='#111';ctx.fillRect(-d.w/2,-d.h/2-10,d.w,5);ctx.fillStyle=friendly?'#65d1f0':'#ee796b';ctx.fillRect(-d.w/2,-d.h/2-10,d.w*Math.max(0,b.hp/b.max),5);ctx.restore()});
units.forEach(u=>{var friendly=u.team==='p';ctx.save();ctx.translate(u.x,u.y);ctx.fillStyle=friendly?'#68c5e4':'#ec7568';ctx.strokeStyle='#111';ctx.lineWidth=2;if(u.type==='tank'||u.type==='artillery'){ctx.fillRect(-13,-9,26,18);ctx.fillStyle=friendly?'#b3d8d9':'#d7aaa0';ctx.fillRect(-5,-4,19,8);ctx.fillStyle='#222';ctx.fillRect(-15,-11,30,4);ctx.fillRect(-15,7,30,4)}else{ctx.beginPath();ctx.arc(0,0,u.type==='worker'?7:8,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#e3d6b5';ctx.fillRect(-3,-3,6,6)}if(selected.includes(u)){ctx.strokeStyle='#ffe38c';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,15,11,0,0,7);ctx.stroke()}ctx.fillStyle='#111';ctx.fillRect(-11,-17,22,3);ctx.fillStyle=friendly?'#74e0a0':'#fa8175';ctx.fillRect(-11,-17,22*Math.max(0,u.hp/u.max),3);ctx.restore()});
bullets.forEach(b=>{ctx.strokeStyle=b.team==='p'?'#a9edff':'#ff9c80';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-(b.tx-b.x)*.06,b.y-(b.ty-b.y)*.06);ctx.stroke()});
effects.forEach(e=>{ctx.strokeStyle='#ffe39b';ctx.beginPath();ctx.arc(e.x,e.y,12*(1-e.t/.2),0,7);ctx.stroke()});
if(drag){ctx.strokeStyle='#ffe38c';ctx.setLineDash([6,4]);ctx.strokeRect(drag.x,drag.y,0,0);ctx.setLineDash([])}
if(placing){var d=buildingDefs[placing];ctx.strokeStyle=canBuildAt(placing,mouse.x,mouse.y)?'#55e08a':'#ff6262';ctx.setLineDash([6,4]);ctx.strokeRect(mouse.x-d.w/2,mouse.y-d.h/2,d.w,d.h);ctx.setLineDash([])}
ctx.restore();
}
var mouse={x:700,y:500};canvas.addEventListener('mousemove',e=>{var p=screenToWorld(e.clientX,e.clientY);mouse=p});
function frame(t){var dt=Math.min(.05,(t-last)/1000||0);last=t;if(!paused&&!gameOver){acc+=dt*speed;while(acc>=.05){tick(.05);acc-=.05}}draw();requestAnimationFrame(frame)}
document.getElementById('start').onclick=()=>{init();started=true;paused=false;document.getElementById('overlay').style.display='none'};
document.getElementById('pause').onclick=()=>{if(!started||gameOver)return;paused=!paused;document.getElementById('pause').textContent=paused?'▶ 繼續':'Ⅱ 暫停';document.getElementById('pauseTag').style.display=paused?'block':'none'};
document.getElementById('speed').onclick=()=>{speed=speed===1?2:speed===2?3:1;document.getElementById('speed').textContent='速度 ×'+speed};
document.getElementById('reset').onclick=()=>{if(confirm('確定要重新開始這場戰役？')){init();started=true;paused=false;document.getElementById('overlay').style.display='none';document.getElementById('pause').textContent='Ⅱ 暫停';document.getElementById('pauseTag').style.display='none'}};
document.getElementById('save').onclick=()=>{try{localStorage.setItem('frontier_save',JSON.stringify({resources:resources,units:units,buildings:buildings,nodes:nodes,elapsed:elapsed,nextId:nextId}));log('遊戲進度已儲存於此瀏覽器')}catch(e){log('儲存失敗')}};
function load(){try{var s=JSON.parse(localStorage.getItem('frontier_save'));if(!s)return false;resources=s.resources;units=s.units;buildings=s.buildings;nodes=s.nodes;elapsed=s.elapsed;nextId=s.nextId;return true}catch(e){return false}}
requestAnimationFrame(frame);
})();
</script>
</body></html>
