<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frontier Command｜前線指揮官</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#1b2833;--line:#344653;--gold:#e5b85c;--cyan:#65c7d8}
*{box-sizing:border-box}body{margin:0;background:#0d151c;color:#e8edf0;font:14px/1.4 system-ui,"Microsoft JhengHei",sans-serif;overflow:hidden}
#top{height:54px;background:#17232d;border-bottom:1px solid #344653;display:flex;align-items:center;gap:18px;padding:0 14px}
.brand{font-weight:900;letter-spacing:1px;color:#f2c66d;font-size:16px}.stat{color:#cbd6dc}.stat b{color:#fff;margin-left:4px;font-variant-numeric:tabular-nums}
#layout{height:calc(100vh - 54px);display:grid;grid-template-columns:minmax(0,1fr) 280px}
#stage{position:relative;min-width:0;min-height:0;background:#18251e}canvas{display:block;width:100%;height:100%;cursor:crosshair}
#side{background:#17232d;border-left:1px solid #344653;display:flex;flex-direction:column;min-height:0}
.panel{padding:12px;border-bottom:1px solid #344653}.panel h3{margin:0 0 9px;font-size:12px;letter-spacing:1px;color:#90a8b5;text-transform:uppercase}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
button{background:#263946;color:#eaf0f3;border:1px solid #425866;border-radius:6px;padding:9px 7px;font-weight:700;cursor:pointer;font-size:12px}
button:hover{background:#345064;border-color:#65c7d8}button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:#785a27;border-color:#c99b45;color:#fff}button.danger{background:#552f30;border-color:#87494b}
#selection{min-height:68px;color:#d9e2e7}.muted{color:#91a3ad;font-size:12px}
#log{overflow:auto;flex:1;padding:10px;font-size:12px;color:#aebdc5}.logline{padding:5px 0;border-bottom:1px solid #263640}
#hint{position:absolute;left:12px;bottom:12px;background:#101820d9;border:1px solid #536b71;border-radius:7px;padding:8px 11px;color:#c8d7dc;pointer-events:none;font-size:12px}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#081016d9;z-index:3}
.modal{width:min(480px,90%);background:#1b2a34;border:1px solid #536b71;border-radius:12px;padding:24px;box-shadow:0 20px 80px #000}
.modal h1{margin:0 0 8px;color:#f2c66d}.modal p{color:#b8c8d0;line-height:1.7}.modal button{width:100%;padding:13px;font-size:15px;margin-top:8px}
#pauseTag{position:absolute;top:12px;left:12px;color:#f2c66d;font-weight:900;display:none;text-shadow:0 2px 5px #000}
@media(max-width:760px){#layout{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 220px}#side{border-left:0;border-top:1px solid #344653;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr}#log{max-height:140px}.panel{padding:8px}.actions{grid-template-columns:repeat(3,1fr)}button{padding:7px 4px;font-size:11px}#top{gap:9px;font-size:11px}.brand{font-size:13px}}
</style>
</head>
<body>
<header id="top"><div class="brand">⚔ FRONTIER COMMAND</div><div class="stat">木材<b id="wood">300</b></div><div class="stat">礦石<b id="ore">220</b></div><div class="stat">石油<b id="oil">100</b></div><div class="stat">人口<b id="pop">5/30</b></div><div class="stat">文明<b id="era">石器時代</b></div><div style="margin-left:auto;display:flex;gap:6px"><button id="pause">Ⅱ 暫停</button><button id="speed">速度 ×1</button><button id="save">存檔</button><button id="reset" class="danger">重開</button></div></header>
<div id="layout"><main id="stage"><canvas id="game"></canvas><div id="pauseTag">PAUSED</div><div id="hint">左鍵選取單位／建築　右鍵移動、攻擊或採集　拖曳框選</div><div id="overlay"><div class="modal"><h1>前線指揮官</h1><p>四國自由混戰：藍方（你）、紅方、紫方、金方各自擁有主堡、資源與軍隊，三個 AI 國家彼此敵對，也會主動發展與進攻。</p><p>地圖四角各有一個國家基地。消滅其他三國即可獲勝；你的主堡被摧毀則戰敗。版本：4N-20261119（大型四國戰場）。</p><button id="start" class="primary">開始戰役</button></div></div></main>
<aside id="side"><section class="panel"><h3>指揮選單</h3><div id="selection">尚未選取單位。<div class="muted">選取平民後可建造設施；選取軍隊後可下達攻擊命令。</div></div></section><section class="panel"><h3>建造／生產</h3><div class="actions" id="actions"></div></section><section class="panel" style="grid-column:1/-1;min-height:0;display:flex;flex-direction:column"><h3>戰場情報</h3><div id="log"></div></section></aside></div>
<script>
(function(){
"use strict";
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
var MAP_SCALE=1.4,W=2100,H=1400,FOG_CELL=50,FOG_COLS=42,FOG_ROWS=28,fogSeen=new Uint8Array(1176),fogNow=new Uint8Array(1176),fogTimer=0,scale=1,ox=0,oy=0,paused=true,speed=1,started=false,gameOver=false,last=0,acc=0,selected=[],placing=null,drag=null;
var resources={wood:600,ore:450,oil:250},enemyResources={wood:600,ore:450,oil:250},countryResources={p:resources,e:{wood:600,ore:450,oil:250},n:{wood:600,ore:450,oil:250},s:{wood:600,ore:450,oil:250}},rallyPoints={p:null,e:null,n:null,s:null},techs={weapons:false,armor:false,engines:false},eras={p:0,e:0,n:0,s:0},wonderLevels={p:0,e:0,n:0,s:0},wonderChosen={p:0,e:0,n:0,s:0},wonderBuffs={p:{military:0,economy:0},e:{military:0,economy:0},n:{military:0,economy:0},s:{military:0,economy:0}},aiWaveTimers={e:0,n:0,s:0},aiWaveCounts={e:1,n:1,s:1},eraNames=['石器時代','封建時代','帝國時代','科技時代'],popCap=30,units=[],buildings=[],nodes=[],bullets=[],effects=[],nextId=1,elapsed=0,aiTimer=0,spawnTimer=0,enemyWaveTimer=0,enemyWaveCount=1;
var ui={wood:document.getElementById('wood'),ore:document.getElementById('ore'),oil:document.getElementById('oil'),pop:document.getElementById('pop'),era:document.getElementById('era'),selection:document.getElementById('selection'),actions:document.getElementById('actions'),log:document.getElementById('log')};
var defs={
worker:{name:'工程平民',cost:{wood:50},time:8,hp:55,range:18,damage:4,rate:1.1,speed:65,kind:'worker',pop:1},
rifle:{name:'步槍兵',cost:{wood:35,ore:15},time:6,hp:75,range:145,damage:10,rate:.8,speed:58,kind:'infantry',pop:1},
rocket:{name:'火箭兵',cost:{wood:25,ore:45},time:9,hp:62,range:190,damage:28,rate:1.8,speed:48,kind:'anti',pop:1},
tank:{name:'主力戰車',cost:{ore:100,oil:35},time:15,hp:260,range:175,damage:38,rate:1.5,speed:42,kind:'vehicle',pop:3},
artillery:{name:'自走火砲',cost:{ore:130,oil:55},time:19,hp:170,range:270,damage:65,rate:3.2,speed:28,kind:'artillery',pop:3},
scout:{name:'偵察車',cost:{ore:55,oil:20},time:10,hp:115,range:105,damage:8,rate:.65,speed:105,kind:'vehicle',pop:2},
medic:{name:'戰地醫護兵',cost:{wood:45,ore:35},time:11,hp:65,range:0,damage:0,rate:1,speed:54,kind:'support',pop:1},
heavy:{name:'重型戰車',cost:{ore:180,oil:90},time:24,hp:430,range:190,damage:58,rate:1.7,speed:31,kind:'vehicle',pop:4}
};
var buildingDefs={
hq:{name:'主堡',cost:{},hp:1300,w:90,h:78,kind:'hq'},
barracks:{name:'兵營',cost:{wood:130,ore:50},hp:550,w:72,h:62,kind:'barracks'},
factory:{name:'戰車工廠',cost:{wood:150,ore:180},hp:700,w:88,h:68,kind:'factory'},
lumber:{name:'伐木場',cost:{wood:90},hp:320,w:58,h:52,kind:'lumber'},
mine:{name:'採礦站',cost:{wood:100,ore:35},hp:360,w:58,h:52,kind:'mine'},
power:{name:'發電廠',cost:{wood:90,ore:35},hp:300,w:56,h:50,kind:'power'},
turret:{name:'機槍塔',cost:{wood:80,ore:100},hp:430,w:48,h:48,kind:'turret'},
fort:{name:'前線堡壘',cost:{wood:160,ore:180},hp:850,w:76,h:68,kind:'fort'},
lab:{name:'科技研究所',cost:{wood:180,ore:140},hp:520,w:70,h:60,kind:'lab'},
bunker:{name:'重型碉堡',cost:{wood:120,ore:140},hp:680,w:60,h:56,kind:'bunker'},
cannon:{name:'重砲塔',cost:{wood:180,ore:220,oil:80},hp:920,w:76,h:72,kind:'cannon'},
missile:{name:'飛彈發射井',cost:{wood:120,ore:160,oil:120},hp:780,w:68,h:64,kind:'missile'},
depot:{name:'補給中心',cost:{wood:150,ore:90},hp:480,w:64,h:56,kind:'depot'},house:{name:'房屋',cost:{wood:100,ore:35},hp:420,w:62,h:54,kind:'house'},wall:{name:'城牆',cost:{wood:35,ore:10},hp:850,w:82,h:30,kind:'wall'},
wonder:{name:'世界奇觀',cost:{wood:900,ore:700,oil:350},hp:2400,w:112,h:104,kind:'wonder'}
};
function log(s){var d=document.createElement('div');d.className='logline';d.textContent='['+fmt(elapsed)+'] '+s;ui.log.prepend(d);while(ui.log.children.length>30)ui.log.lastChild.remove()}
function fmt(t){return Math.floor(t/60)+':'+('0'+Math.floor(t%60)).slice(-2)}
function costText(c){return Object.keys(c).map(k=>({wood:'木',ore:'礦',oil:'油'}[k])+c[k]).join(' ')}
function eraName(team){return eraNames[eras[team]||0]}
function unitName(type,team){var names={worker:['石器採集者','封建工匠','帝國工程師','科技工程師'],rifle:['石矛戰士','長弓兵','火槍兵','電磁步兵'],rocket:['投石兵','弩砲手','火箭兵','等離子反裝甲兵'],scout:['馴狼斥候','輕騎斥候','裝甲偵察車','無人偵察機'],medic:['草藥療癒師','戰地醫護兵','野戰醫療官','醫療機器人'],tank:['攻城車','重型攻城車','主力戰車','懸浮重戰車'],artillery:['投石器','重型弩砲','自走火砲','軌道火砲'],heavy:['巨型攻城機','重裝戰車','超重型戰車','泰坦機甲']};return (names[type]||[])[eras[team]||0]||defs[type].name}
function canBuildAt(type,x,y){var d=buildingDefs[type];if(x-d.w/2<0||x+d.w/2>W||y-d.h/2<0||y+d.h/2>H)return false;return !buildings.some(b=>{var q=buildingDefs[b.type];return Math.abs(b.x-x)<(q.w+d.w)/2+8&&Math.abs(b.y-y)<(q.h+d.h)/2+8})}
function minEraForBuilding(type){return ({factory:1,lab:1,bunker:2,depot:2,cannon:2,missile:2,fort:1,turret:1,wonder:0})[type]||0}
function minEraForUnit(type){return ({rocket:1,scout:1,medic:1,tank:2,artillery:2,heavy:3})[type]||0}
function eraCost(next){return [{wood:150,ore:100},{wood:300,ore:250,oil:100},{wood:450,ore:400,oil:250}][next-1]}
function wonderUpgradeCost(level){return [null,{wood:900,ore:700,oil:350},{wood:1500,ore:1200,oil:700},{wood:2500,ore:2000,oil:1400}][level]}
function canWonderUpgrade(team,level){var own=buildings.filter(b=>b.team===team);if(level===1)return own.some(b=>b.type==='barracks');if(level===2)return eras[team]>=1&&own.some(b=>b.type==='factory')&&own.some(b=>b.type==='lab');if(level===3)return eras[team]>=2&&own.some(b=>b.type==='lab')&&own.some(b=>b.type==='depot');return false}
function grantWonderBuff(team,type){wonderBuffs[team][type]++;wonderChosen[team]++;if(team==='p')log(type==='military'?'世界奇觀加成：全兵種攻擊力永久 +15%。':'世界奇觀加成：所有資源採集效率永久 +25%。')}
function canAdvance(team,next){var own=buildings.filter(b=>b.team===team);if(wonderLevels[team]<next||wonderChosen[team]<next)return false;if(next===1)return own.some(b=>b.type==='barracks');if(next===2)return own.some(b=>b.type==='factory')&&own.some(b=>b.type==='lab');return own.some(b=>b.type==='lab')&&own.some(b=>b.type==='depot')}
function advanceEra(team){var next=eras[team]+1,c=eraCost(next),wallet=countryResources[team]||resources;if(next>3||!canAdvance(team,next)||!Object.keys(c).every(k=>(wallet[k]||0)>=c[k]))return false;Object.keys(c).forEach(k=>wallet[k]-=c[k]);eras[team]=next;if(team==='p')log('文明躍進！進入'+eraNames[next]+'，兵種名稱與可用科技已更新。');return true}
function canPay(c){return Object.keys(c).every(k=>resources[k]>=c[k])}
function pay(c){if(!canPay(c))return false;Object.keys(c).forEach(k=>resources[k]-=c[k]);return true}
function makeUnit(team,type,x,y){var d=defs[type],u={id:nextId++,team:team,kind:'unit',type:type,x:x,y:y,hp:d.hp,max:d.hp,order:null,target:null,carry:0,resource:null,cool:Math.random(),buildQueue:[],moving:false};units.push(u);return u}
function makeBuilding(team,type,x,y){var d=buildingDefs[type],b={id:nextId++,team:team,kind:'building',type:type,x:x,y:y,hp:d.hp,max:d.hp,queue:[],progress:0,active:true,rallyOrder:null};buildings.push(b);return b}
function node(type,x,y,amount){var zone=x<W/2?(y<H/2?'p':'n'):(y<H/2?'e':'s');if(Math.abs(x-W/2)<190*MAP_SCALE)zone='center';nodes.push({type:type,x:x,y:y,amount:amount,max:amount,zone:zone})}
function init(){
fogSeen.fill(0);fogNow.fill(0);fogTimer=0;
resources={wood:600,ore:450,oil:250};enemyResources={wood:600,ore:450,oil:250};countryResources={p:resources,e:{wood:600,ore:450,oil:250},n:{wood:600,ore:450,oil:250},s:{wood:600,ore:450,oil:250}};
rallyPoints={p:null,e:null,n:null,s:null};techs={weapons:false,armor:false,engines:false};eras={p:0,e:0,n:0,s:0};wonderLevels={p:0,e:0,n:0,s:0};wonderChosen={p:0,e:0,n:0,s:0};wonderBuffs={p:{military:0,economy:0},e:{military:0,economy:0},n:{military:0,economy:0},s:{military:0,economy:0}};aiWaveTimers={e:0,n:0,s:0};aiWaveCounts={e:1,n:1,s:1};units=[];buildings=[];nodes=[];bullets=[];effects=[];nextId=1;elapsed=0;aiTimer=0;spawnTimer=0;enemyWaveTimer=0;enemyWaveCount=1;gameOver=false;selected=[];placing=null;popCap=30;
var bases={p:{x:180*MAP_SCALE,y:180*MAP_SCALE,dx:1,dy:1},e:{x:1320*MAP_SCALE,y:180*MAP_SCALE,dx:-1,dy:1},n:{x:180*MAP_SCALE,y:820*MAP_SCALE,dx:1,dy:-1},s:{x:1320*MAP_SCALE,y:820*MAP_SCALE,dx:-1,dy:-1}};
Object.keys(bases).forEach(team=>{var q=bases[team];makeBuilding(team,'hq',q.x,q.y);makeBuilding(team,'barracks',q.x+q.dx*112*MAP_SCALE,q.y+q.dy*65*MAP_SCALE);if(team!=='p')makeBuilding(team,'fort',q.x+q.dx*205*MAP_SCALE,q.y+q.dy*5*MAP_SCALE);for(var i=0;i<4;i++)makeUnit(team,'worker',q.x+q.dx*(70+i*17)*MAP_SCALE,q.y+q.dy*(95+(i%2)*18)*MAP_SCALE);for(var j=0;j<(team==='p'?1:3);j++)makeUnit(team,'rifle',q.x+q.dx*(155+j*18)*MAP_SCALE,q.y+q.dy*(45+(j%2)*18)*MAP_SCALE);});
var patches=[['wood',[[360,90],[90,360],[1140,90],[1410,360],[360,910],[90,640],[1140,910],[1410,640],[700,300],[800,700]],3,2,34,38,6500],['ore',[[430,280],[280,430],[1070,280],[1220,430],[430,720],[280,570],[1070,720],[1220,570],[680,450],[820,550]],2,2,38,42,7200],['oil',[[520,90],[90,520],[980,90],[1410,520],[520,910],[90,480],[980,910],[1410,480],[750,180],[750,820]],2,1,42,0,5600]];
patches.forEach(v=>v[1].forEach(p=>{for(var a=0;a<v[2];a++)for(var b=0;b<v[3];b++)node(v[0],(p[0]+a*v[4])*MAP_SCALE,(p[1]+b*v[5])*MAP_SCALE,v[6])}));
updateUI();log('四國混戰開始：四個國家彼此敵對，爭奪中央資源與世界奇觀。');
}
function countPop(team){return units.filter(u=>u.team===team).reduce((a,u)=>a+defs[u.type].pop,0)}
function teamPopCap(team){return 30+buildings.filter(b=>b.team===team&&b.type==='hq').length*10+buildings.filter(b=>b.team===team&&b.type==='fort').length*5+buildings.filter(b=>b.team===team&&b.type==='house').length*20}
function myCap(){return teamPopCap('p')}
function updateUI(){
selected=selected.filter(o=>o&&Number(o.hp)>0);ui.wood.textContent=Math.floor(resources.wood);ui.ore.textContent=Math.floor(resources.ore);ui.oil.textContent=Math.floor(resources.oil);ui.pop.textContent=countPop('p')+'/'+myCap();ui.era.textContent=eraName('p');
try{renderActions();renderSelection()}catch(err){console.error('UI render error',err);ui.selection.textContent='介面更新錯誤：'+(err&&err.message?err.message:'未知錯誤');ui.actions.replaceChildren()}
}
var buildHotkeys={house:'H',wall:'T',barracks:'1',factory:'2',lumber:'3',mine:'4',power:'5',turret:'6',fort:'7',lab:'8',bunker:'9',depot:'0',cannon:'Q',missile:'W',wonder:'E'};
function startBuild(k){var d=buildingDefs[k];if(!d||!selected.some(o=>o.team==='p'&&o.kind==='unit'&&o.type==='worker'))return;if(eras.p<minEraForBuilding(k)||!canPay(d.cost)){log('無法建造：時代或資源不足。');return}placing=k;log('選擇建造'+d.name+'：按右鍵放置，Esc 取消。');renderActions()}
function renderActions(){
var b=selected.length===1?selected[0]:null,html='';
function btn(label,fn,disabled){var el=document.createElement('button');el.textContent=label;el.disabled=!!disabled;el.onclick=fn;ui.actions.appendChild(el)}
ui.actions.innerHTML='';
if(placing){btn('取消建造 [Esc]',function(){placing=null;renderActions()});return}
if(b&&b.team==='p'&&b.kind==='unit'&&b.type==='worker'){
var keyHint=document.createElement('div');keyHint.className='hint';keyHint.textContent='建築快捷鍵：1–0、Q/W/E、T 城牆；Esc 取消建造';ui.actions.appendChild(keyHint);
Object.keys(buildingDefs).filter(k=>k!=='hq'&&eras.p>=minEraForBuilding(k)&&(k!=='wonder'||!buildings.some(v=>v.team==='p'&&v.type==='wonder'))).forEach(k=>{var d=buildingDefs[k];btn(d.name+' ['+(buildHotkeys[k]||'')+']\n'+costText(d.cost),function(){startBuild(k)},!canPay(d.cost))});
}else if(b&&b.team==='p'&&b.kind==='building'){
if(['hq','barracks','factory'].includes(b.type)){
var ro=b.rallyOrder;var rallyLabel=!ro?'未設定':ro.type==='attack'?'攻擊目標':ro.type==='gather'?'資源目標':'地面座標';
var rl=document.createElement('div');rl.className='hint';rl.textContent='生產集結：'+rallyLabel+'（右鍵地面／資源／敵軍設定）';ui.actions.appendChild(rl);
btn('取消生產集結指令',function(){b.rallyOrder=null;log('已取消此建築的生產集結指令。');updateUI()},!ro);
}
if(b.type==='hq'){var next=eras.p+1;if(next<=3){var ec=eraCost(next),req=next===1?'需要兵營＋第一階段世界奇觀':next===2?'需要戰車工廠、研究所＋第二階段世界奇觀':'需要研究所、補給中心＋第三階段世界奇觀';btn('文明躍進：'+eraNames[next]+'（'+costText(ec)+'）',function(){if(advanceEra('p'))updateUI();else log('升級條件不足：'+req+'，或資源不足。')},!canAdvance('p',next)||!canPay(ec))}}
if(b.type==='hq'||b.type==='barracks'){btn(unitName('worker','p')+' '+costText(defs.worker.cost),function(){train(b,'worker')},!canPay(defs.worker.cost)||countPop('p')>=myCap());}

ne'){ctx.beginPath();ctx.moveTo(-d.w*.35,d.h*.25);ctx.lineTo(-d.w*.2,-d.h*.3);ctx.lineTo(d.w*.25,-d.h*.3);ctx.lineTo(d.w*.35,d.h*.25);ctx.closePath();ctx.fill()}else if(b.type==='power'){ctx.beginPath();ctx.moveTo(-d.w*.25,-d.h*.3);ctx.lineTo(d.w*.25,-d.h*.3);ctx.lineTo(d.w*.18,d.h*.3);ctx.lineTo(-d.w*.18,d.h*.3);ctx.closePath();ctx.fill();ctx.fillRect(-3,-d.h*.45,6,12)}else if(b.type==='lab'){ctx.beginPath();ctx.arc(0,0,Math.min(d.w,d.h)*.28,0,7);ctx.fill();ctx.fillRect(-4,-d.h*.45,8,12)}else if(b.type==='depot'){ctx.fillRect(-d.w*.35,-d.h*.25,d.w*.7,d.h*.5);ctx.fillStyle='#222';ctx.fillRect(-d.w*.2,-d.h*.1,d.w*.4,d.h*.2)}else if(b.type==='house'){ctx.fillStyle='#b58b59';ctx.fillRect(-d.w*.38,-d.h*.12,d.w*.76,d.h*.48);ctx.fillStyle='#e3c58b';ctx.beginPath();ctx.moveTo(-d.w*.48,-d.h*.1);ctx.lineTo(0,-d.h*.48);ctx.lineTo(d.w*.48,-d.h*.1);ctx.closePath();ctx.fill();ctx.fillStyle='#29343a';ctx.fillRect(-7,5,14,18);ctx.fillRect(12,-8,9,9)}else if(b.type==='fort'){ctx.fillRect(-d.w*.32,-d.h*.32,d.w*.64,d.h*.64);ctx.fillStyle='#222';ctx.fillRect(-5,-d.h*.45,10,16)}else if(b.type==='bunker'){ctx.beginPath();ctx.moveTo(-d.w*.35,d.h*.25);ctx.lineTo(-d.w*.3,-d.h*.2);ctx.lineTo(0,-d.h*.4);ctx.lineTo(d.w*.3,-d.h*.2);ctx.lineTo(d.w*.35,d.h*.25);ctx.closePath();ctx.fill();ctx.fillStyle='#222';ctx.fillRect(-6,-d.h*.15,12,12)}else if(b.type==='cannon'){ctx.fillStyle='#252d32';ctx.fillRect(-d.w*.38,-d.h*.34,d.w*.76,d.h*.68);ctx.fillStyle=palette[1];ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#20272b';ctx.fillRect(-6,-d.h*.52,12,d.h*.58);ctx.fillRect(-11,-d.h*.52,22,10)}else if(b.type==='missile'){ctx.fillStyle='#252d32';ctx.fillRect(-d.w*.36,-d.h*.28,d.w*.72,d.h*.56);ctx.fillStyle=palette[1];for(var mi=-1;mi<=1;mi++){ctx.beginPath();ctx.moveTo(mi*17-6,-d.h*.48);ctx.lineTo(mi*17+6,-d.h*.48);ctx.lineTo(mi*17+5,d.h*.1);ctx.lineTo(mi*17-5,d.h*.1);ctx.closePath();ctx.fill()}ctx.fillStyle='#20272b';ctx.fillRect(-d.w*.42,d.h*.22,d.w*.84,8)}else if(b.type==='turret'){ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.fill();ctx.fillStyle='#1a252b';ctx.fillRect(-4,-25,8,27)}else{ctx.fillRect(-d.w*.25,-d.h*.25,d.w*.5,d.h*.5)}ctx.fillStyle='#111';ctx.fillRect(-d.w/2,-d.h/2-10,d.w,5);ctx.fillStyle=palette[1];ctx.fillRect(-d.w/2,-d.h/2-10,d.w*Math.max(0,b.hp/b.max),5);ctx.restore()});
// 四國固定識別標籤：四個出生陣營在地圖上都有明確名稱。
var factionLabels=[
 {team:'p',name:'藍方・玩家',x:180,y:112,color:'#68c5e4'},
 {team:'e',name:'紅方・AI 1',x:1320,y:112,color:'#ec7568'},
 {team:'n',name:'紫方・AI 2',x:180,y:724,color:'#b99be8'},
 {team:'s',name:'金方・AI 3',x:1320,y:724,color:'#f0c45c'}
];
factionLabels.forEach(f=>{var alive=buildings.some(b=>b.team===f.team&&b.type==='hq')||units.some(u=>u.team===f.team&&u.type==='worker'&&u.hp>0)||buildings.some(b=>b.team===f.team&&(b.queue||[]).some(q=>q.type==='worker'));ctx.save();ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';var label=f.name+(alive?'':'（已淘汰）');var w=ctx.measureText(label).width+24;ctx.fillStyle='rgba(8,16,22,.88)';ctx.fillRect(f.x-w/2,f.y-17,w,34);ctx.strokeStyle=f.color;ctx.lineWidth=2;ctx.strokeRect(f.x-w/2,f.y-17,w,34);ctx.fillStyle=f.color;ctx.fillText(label,f.x,f.y);ctx.restore()});
units.filter(u=>u.team==='p'||fogCanSee(u.x,u.y)).forEach(u=>{var palette={p:'#68c5e4',e:'#ec7568',n:'#b99be8',s:'#f0c45c'}[u.team]||'#aaa';ctx.save();ctx.translate(u.x,u.y);ctx.fillStyle=palette;ctx.strokeStyle='#111';ctx.lineWidth=2;if(['tank','heavy','artillery','scout'].includes(u.type)){if(u.type==='artillery'){ctx.fillRect(-15,-10,30,20);ctx.fillStyle='#ddd';ctx.fillRect(-3,-4,22,8);ctx.fillStyle='#222';ctx.fillRect(-16,-12,32,4);ctx.fillRect(-16,8,32,4)}else if(u.type==='scout'){ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(13,9);ctx.lineTo(-13,9);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillRect(-3,-4,10,4)}else if(u.type==='heavy'){ctx.fillRect(-16,-12,32,24);ctx.fillStyle='#222';ctx.fillRect(-19,-14,38,5);ctx.fillRect(-19,9,38,5);ctx.fillStyle='#eee';ctx.fillRect(-5,-5,22,10)}else{ctx.fillRect(-13,-9,26,18);ctx.fillStyle='#eee';ctx.fillRect(-4,-4,18,8);ctx.fillStyle='#222';ctx.fillRect(-15,-11,30,4);ctx.fillRect(-15,7,30,4)}}else if(u.type==='worker'){ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#e3d6b5';ctx.fillRect(-2,-11,4,5)}else if(u.type==='rifle'){ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#222';ctx.fillRect(2,-2,13,3)}else if(u.type==='rocket'){ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(9,8);ctx.lineTo(-9,8);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#222';ctx.fillRect(4,-3,12,4)}else if(u.type==='medic'){ctx.fillRect(-8,-8,16,16);ctx.fillStyle='#fff';ctx.fillRect(-2,-6,4,12);ctx.fillRect(-6,-2,12,4)}if(selected.includes(u)){ctx.strokeStyle='#ffe38c';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,15,11,0,0,7);ctx.stroke()}ctx.fillStyle='#111';ctx.fillRect(-11,-17,22,3);ctx.fillStyle=palette;ctx.fillRect(-11,-17,22*Math.max(0,u.hp/u.max),3);ctx.restore()});
bullets.forEach(b=>{ctx.strokeStyle={p:'#a9edff',e:'#ff9c80',n:'#d7b9ff',s:'#ffe08a'}[b.team]||'#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-(b.tx-b.x)*.06,b.y-(b.ty-b.y)*.06);ctx.stroke()});
effects.forEach(e=>{ctx.strokeStyle='#ffe39b';ctx.beginPath();ctx.arc(e.x,e.y,12*(1-e.t/.2),0,7);ctx.stroke()});
if(drag){ctx.strokeStyle='#ffe38c';ctx.setLineDash([6,4]);ctx.strokeRect(drag.x,drag.y,0,0);ctx.setLineDash([])}
if(placing){var d=buildingDefs[placing];ctx.strokeStyle=canBuildAt(placing,mouse.x,mouse.y)?'#55e08a':'#ff6262';ctx.setLineDash([6,4]);ctx.strokeRect(mouse.x-d.w/2,mouse.y-d.h/2,d.w,d.h);ctx.setLineDash([])}
for(var fy=0;fy<FOG_ROWS;fy++)for(var fx=0;fx<FOG_COLS;fx++){var fi=fy*FOG_COLS+fx;if(!fogNow[fi]){ctx.fillStyle=fogSeen[fi]?'rgba(5,10,16,.48)':'rgba(3,7,12,.96)';ctx.fillRect(fx*FOG_CELL,fy*FOG_CELL,FOG_CELL,FOG_CELL)}}
ctx.restore();
}
var mouse={x:700,y:500};canvas.addEventListener('mousemove',e=>{var p=screenToWorld(e.clientX,e.clientY);mouse=p});
function frame(t){var dt=Math.min(.05,(t-last)/1000||0);last=t;if(!paused&&!gameOver){acc+=dt*speed;while(acc>=.05){tick(.05);acc-=.05}}draw();requestAnimationFrame(frame)}
document.getElementById('start').onclick=()=>{init();started=true;paused=false;document.getElementById('overlay').style.display='none'};
document.getElementById('pause').onclick=()=>{if(!started||gameOver)return;paused=!paused;document.getElementById('pause').textContent=paused?'▶ 繼續':'Ⅱ 暫停';document.getElementById('pauseTag').style.display=paused?'block':'none'};
document.getElementById('speed').onclick=()=>{speed=speed===1?2:speed===2?3:1;document.getElementById('speed').textContent='速度 ×'+speed};
document.getElementById('reset').onclick=()=>{if(confirm('確定要重新開始這場戰役？')){init();started=true;paused=false;document.getElementById('overlay').style.display='none';document.getElementById('pause').textContent='Ⅱ 暫停';document.getElementById('pauseTag').style.display='none'}};
document.getElementById('save').onclick=()=>{try{localStorage.setItem('frontier_save',JSON.stringify({resources:resources,units:units,buildings:buildings,nodes:nodes,elapsed:elapsed,nextId:nextId,eras:eras,techs:techs,wonderLevels:wonderLevels,wonderChosen:wonderChosen,wonderBuffs:wonderBuffs}));log('遊戲進度已儲存於此瀏覽器')}catch(e){log('儲存失敗')}};
function load(){try{var s=JSON.parse(localStorage.getItem('frontier_save'));if(!s)return false;resources=s.resources;units=s.units;buildings=s.buildings;nodes=s.nodes;elapsed=s.elapsed;nextId=s.nextId;eras=s.eras||{p:0,e:0};techs=s.techs||{weapons:false,armor:false,engines:false};wonderLevels=s.wonderLevels||{p:0,e:0};wonderChosen=s.wonderChosen||{p:0,e:0};wonderBuffs=s.wonderBuffs||{p:{military:0,economy:0},e:{military:0,economy:0}};return true}catch(e){return false}}
requestAnimationFrame(frame);
})();
</script>
